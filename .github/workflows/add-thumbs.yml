# Adds photos-page thumbnails to a batch published before they existed. The feed doesn't change.
name: Add thumbnails to a batch
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Batch, e.g. 2026-10
        required: true
permissions:
  contents: write
concurrency: { group: feed, cancel-in-progress: false }
jobs:
  add-thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Make thumbnails
        run: npm run add-thumbs -- --batch "$BATCH"
      # Thumbnails go up first; the page that shows them is committed only after.
      - name: Upload thumbnails
        run: |
          gh release view "thumbs-$BATCH" >/dev/null 2>&1 || \
            gh release create "thumbs-$BATCH" --title "Thumbnails $BATCH" \
              --notes "Small copies of the $BATCH photos for https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/photos.html"
          gh release upload "thumbs-$BATCH" "out/thumbs-$BATCH"/*.webp --clobber
      - name: Publish the photos page
        run: |
          git add docs
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git -c user.name=picture-window -c user.email=actions@github.com commit -qm "Add the photos page for batch $BATCH"
          git push
